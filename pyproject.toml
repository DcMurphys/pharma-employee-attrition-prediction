[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-attrition"
version = "0.1.0"
description = "Shared configuration and decision rules for MurphysBio employee attrition prediction."
readme = "README.md"
# The saved pipeline was trained with scikit-learn 1.6.1, which has no wheels for Python 3.14.
requires-python = ">=3.13,<3.14"
# Exact pins live in dashboard/requirements.txt and environment.yml.
dependencies = ["numpy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "."]
# The notebooks are the source of truth and are never reformatted by tooling.
extend-exclude = ["notebooks", "archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["employee_attrition", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
